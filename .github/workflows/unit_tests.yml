## Disclaimer - This GitHub Actions workflow runs all the unit tests for the project.

# Name the workflow
name: unit_testing

# Define when it runs
on:
  push:
    paths:
      - '**.py'
      - 'narps_open/**/*'
      - 'setup.py'
      - 'pytest.ini'
      - 'tests/conftest.py'
  pull_request:
    paths:
      - '**.py'
      - 'narps_open/**/*'
      - 'setup.py'
      - 'pytest.ini'
      - 'tests/conftest.py'

# Jobs that define the workflow
jobs:

  # Name of the job running unit tests
  pytest:

    # Define the runner for this job
    runs-on: ubuntu-latest

    # Steps that define the job
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build docker image
      run: docker build -t narps_open:${{github.sha}} .

    - name: Launch tests with pytest & get code coverage
      run: |
        docker run -it -v $PWD:/work narps_open:${{git_sha}} coverage run -m pytest --junit-xml=pytest_report.xml -m "not pipeline_test"
        docker run -it -v $PWD:/work narps_open:${{git_sha}} coverage report
        docker run -it -v $PWD:/work narps_open:${{git_sha}} coverage xml

    - name: Archive pytest results
      if: ${{ failure() }} # Run only if previous job fails
      uses: actions/upload-artifact@v4
      with:
        name: unit_tests-reports
        path: |
          pytest_report.xml
          coverage.xml
        retention-days: 15
