## Disclaimer - This GitHub Actions workflow runs all the unit tests for the project.

# Name the workflow
name: unit_testing

# Define when it runs
on:
  push:
    paths:
      - '**.py'
      - 'narps_open/**/*'
      - 'setup.py'
      - 'pytest.ini'
      - 'tests/conftest.py'
  pull_request:
    paths:
      - '**.py'
      - 'narps_open/**/*'
      - 'setup.py'
      - 'pytest.ini'
      - 'tests/conftest.py'

# Jobs that define the workflow
jobs:

  # Name of the job running unit tests
  pytest:

    # Define the runner for this job
    runs-on: ubuntu-latest

    # Steps that define the job
    steps:
    - uses: actions/checkout@v7

    - name: Build docker image
      run: docker build -t narps_open:${{github.sha}} .

    - name: Launch tests with pytest & get code coverage
      run: |
        docker run -u root -v $PWD:/work narps_open:${{github.sha}} /usr/bin/env bash -c "git config --global user.name actions ; git config --global user.email actions@github.com ; datalad install data/original/ds001734"
        docker run -u root -v $PWD:/work narps_open:${{github.sha}} /usr/bin/env bash -c "git config --global user.name actions ; git config --global user.email actions@github.com ; datalad install data/results"
        docker run -u root -v $PWD:/work narps_open:${{github.sha}} coverage run -m pytest --junit-xml=pytest_report.xml -m "not pipeline_test"
        docker run -u root -v $PWD:/work narps_open:${{github.sha}} coverage report
        docker run -u root -v $PWD:/work narps_open:${{github.sha}} coverage xml

    - name: Archive pytest results
      uses: actions/upload-artifact@v7
      with:
        name: unit_tests-reports
        path: |
          pytest_report.xml
          coverage.xml
        retention-days: 15
